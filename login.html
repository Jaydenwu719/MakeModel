<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakeModel</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
</head>

<body id="Contact-page">

    <header class="header">
        <button class="Logo"><img src="Logo.png" alt=""></button>
    </header>

    <nav class="navbar">

        <div class="container">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li class="nav-register">
                    <p>Don't have an Account?</p>
                    <a href="register.html">Register</a>
                </li>
                <li><a href="models.html">Models</a></li>
                <li><a href="extensions.html">Extensions</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <a href="login.html">
                <button class="Login-button" type="button" aria-label="Log in">
                    <i class="bx bx-user-circle"></i>
                </button>
            </a>
            <button class="Create" type="button">+ Create</button>

            <input type="checkbox" id="toggle">
            <label for="toggle" class="hamburger-button">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </div>
    </nav>

    <div id="Log-in">
        <div class="wrapper">
            <h1>Log In</h1>

            <div class="inputs">
                <input type="text" name="username" placeholder="Username" aria-label="Username" autocomplete="username">
                <i class="bx bx-user"></i>
            </div>
            <div class="inputs">
                <input type="password" name="password" placeholder="Password" aria-label="Password"
                    autocomplete="current-password">
                <i class="bx bx-lock"></i>
            </div>

            <div class="remember-forgot">
                <label for="remember-me"><input type="checkbox" name="remember-me" id="remember-me">Remember Me</label>
                <a href="#Pass-Reset">Forgot Password</a>
            </div>

            <div class="button"><button type="button" onclick="window.location.href='index.html'">Log In</button></div>


            <div class="register">
                <p>Don't have an Account?</p>
                <div class="button"><button type="button"
                        onclick="window.location.href='register.html'">Register</button></div>

            </div>


        </div>
    </div>
    <script src="function.js"></script>
</body>

</html>
