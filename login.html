<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
</head>

<body>
    <nav class="navbar">
        <button class="Logo"><img src="Logo.png" alt=""></button>

        <div class="container">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#models">Models</a></li>
                <li><a href="#extensions">Extensions</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </div>

        <button class="Create">+ Create</button>
    </nav>


    <div id="Log-in">
        <div class="wrapper">
            <h1>Log In</h1>

            <div class="inputs">
                <input type="text" placeholder="Username">
                <i class="bx bx-user"></i>
            </div>
            <div class="inputs">
                <input type="password" placeholder="Password">
                <i class="bx bx-lock"></i>
            </div>

            <div class="remember-forgot">
                <label for=""><input type="checkbox" name="" id="">Remember Me</label>
                <a href="#Pass-Reset">Forgot Password</a>
            </div>

            <div class="button"><button>Log In</button></div>

            <div class="register">
                <p>Don't have an Account?</p> <a href="#Register">Register</a>
            </div>


        </div>
    </div>
</body>

</html>
